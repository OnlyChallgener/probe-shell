name: Finalize v0.7.2 wallpapers

on:
  push:
    branches:
      - fix/wallpaper-v072
    paths:
      - .github/workflows/finalize-v072.yml
      - scripts/prepare_v072.py
      - scripts/optimize_v072.py
  pull_request:
    branches:
      - release/v0.7.1-squash
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-v072-wallpapers
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout clean fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/wallpaper-v072
          fetch-depth: 0

      - name: Install image and Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libfontconfig1-dev python3-pil

      - name: Apply source and asset fixes
        run: |
          set -euo pipefail
          python3 scripts/prepare_v072.py
          python3 scripts/optimize_v072.py

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format and validate
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo check --locked
          cargo test --locked

      - name: Commit v0.7.2 source and optimized assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md src/wallpaper.rs ui/app.slint ui/interface_panel.slint assets/wallpapers
          git commit -m "fix: restore light wallpapers and reduce bundle size"
          git push origin HEAD:fix/wallpaper-v072
