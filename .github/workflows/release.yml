name: Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to build and publish, for example v0.7.0
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Verify release version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      label: ${{ steps.version.outputs.label }}
      source_ref: ${{ steps.version.outputs.source_ref }}
      publish_release: ${{ steps.version.outputs.publish_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Verify tag and Cargo version
        id: version
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="$(awk '
            /^\[package\]$/ { in_package=1; next }
            /^\[/ && in_package { exit }
            in_package && /^version[[:space:]]*=/ {
              line=$0
              sub(/^[^=]*=[[:space:]]*"/, "", line)
              sub(/"[[:space:]]*$/, "", line)
              print line
              exit
            }
          ' Cargo.toml)"
          test -n "$version"

          if [[ -n "$REQUESTED_TAG" ]]; then
            label="$REQUESTED_TAG"
            source_ref="$REQUESTED_TAG"
            publish_release=true
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            label="$GITHUB_REF_NAME"
            source_ref="$GITHUB_REF"
            publish_release=true
          else
            label="dev-$GITHUB_RUN_NUMBER"
            source_ref="$GITHUB_REF"
            publish_release=false
          fi

          if [[ "$publish_release" == true && "$label" != "v${version}" ]]; then
            echo "Tag $label does not match Cargo version $version" >&2
            exit 1
          fi

          {
            echo "version=$version"
            echo "label=$label"
            echo "source_ref=$source_ref"
            echo "publish_release=$publish_release"
          } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.source_ref }}

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake file wget \
            libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev libudev-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Windows portable ZIP
        if: matrix.name == 'windows-x86_64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $label = '${{ needs.check.outputs.label }}'
          $stage = "probe-shell-$label-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/probe-shell.exe" $stage
          Copy-Item README.md, README.en.md, CHANGELOG.md $stage -ErrorAction SilentlyContinue
          Compress-Archive -Path $stage -DestinationPath "dist/$stage-portable.zip" -Force

      - name: Build Windows MSI
        if: matrix.name == 'windows-x86_64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $label = '${{ needs.check.outputs.label }}'
          $version = '${{ needs.check.outputs.version }}'
          $exe = (Resolve-Path "target/${{ matrix.target }}/release/probe-shell.exe").Path
          $escapedExe = [System.Security.SecurityElement]::Escape($exe)

          choco install wixtoolset -y --no-progress
          $candle = Get-ChildItem 'C:\Program Files (x86)' -Filter candle.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $candle) { throw 'candle.exe was not found after installing WiX Toolset' }
          $light = Join-Path $candle.Directory.FullName 'light.exe'
          if (-not (Test-Path $light)) { throw 'light.exe was not found after installing WiX Toolset' }

          @"
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
            <Product Id="*" Name="Probe Shell" Language="1033" Version="$version" Manufacturer="OnlyChallgener" UpgradeCode="BDBCF0D4-8911-49BD-8C74-B1130B7B10A7">
              <Package InstallerVersion="500" Compressed="yes" InstallScope="perMachine" Platform="x64" />
              <MajorUpgrade DowngradeErrorMessage="A newer version of Probe Shell is already installed." />
              <MediaTemplate EmbedCab="yes" />
              <Feature Id="ProductFeature" Title="Probe Shell" Level="1">
                <ComponentRef Id="ProbeShellExecutable" />
              </Feature>
              <Directory Id="TARGETDIR" Name="SourceDir">
                <Directory Id="ProgramFiles64Folder">
                  <Directory Id="INSTALLFOLDER" Name="Probe Shell" />
                </Directory>
              </Directory>
              <DirectoryRef Id="INSTALLFOLDER">
                <Component Id="ProbeShellExecutable" Guid="*" Win64="yes">
                  <File Id="ProbeShellExe" Source="$escapedExe" KeyPath="yes" />
                </Component>
              </DirectoryRef>
            </Product>
          </Wix>
          "@ | Set-Content -Path probe-shell.wxs -Encoding UTF8

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $candle.FullName -nologo -arch x64 -out dist/probe-shell.wixobj probe-shell.wxs
          & $light -nologo -out "dist/probe-shell-$label-windows-x86_64.msi" dist/probe-shell.wixobj
          Remove-Item dist/probe-shell.wixobj -Force

      - name: Package Linux tar.gz and AppImage
        if: matrix.name == 'linux-x86_64'
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          label='${{ needs.check.outputs.label }}'
          stage="probe-shell-${label}-linux-x86_64"
          mkdir -p "$stage" dist AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/512x512/apps
          cp "target/${{ matrix.target }}/release/probe-shell" "$stage/"
          cp README.md README.en.md CHANGELOG.md "$stage/" 2>/dev/null || true
          tar -czf "dist/${stage}.tar.gz" "$stage"

          install -m755 "target/${{ matrix.target }}/release/probe-shell" AppDir/usr/bin/probe-shell
          install -m644 assets/icon@512.png AppDir/usr/share/icons/hicolor/512x512/apps/probe-shell.png
          cat > AppDir/usr/share/applications/probe-shell.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Probe Shell
          Comment=SSH terminal and router-friendly file browser
          Exec=probe-shell
          Icon=probe-shell
          Categories=Network;RemoteAccess;System;
          Terminal=false
          EOF

          wget -q -O linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -O linuxdeploy-plugin-appimage https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-appimage
          ./linuxdeploy \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/probe-shell.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/512x512/apps/probe-shell.png \
            --output appimage
          appimage="$(find . -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          mv "$appimage" "dist/probe-shell-${label}-linux-x86_64.AppImage"

      - name: Package macOS application ZIP
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          label='${{ needs.check.outputs.label }}'
          version='${{ needs.check.outputs.version }}'
          app="Probe Shell.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" dist probe-shell.iconset
          cp "target/${{ matrix.target }}/release/probe-shell" "$app/Contents/MacOS/probe-shell"
          chmod +x "$app/Contents/MacOS/probe-shell"

          sips -z 16 16 assets/icon@512.png --out probe-shell.iconset/icon_16x16.png >/dev/null
          sips -z 32 32 assets/icon@512.png --out probe-shell.iconset/icon_16x16@2x.png >/dev/null
          sips -z 32 32 assets/icon@512.png --out probe-shell.iconset/icon_32x32.png >/dev/null
          sips -z 64 64 assets/icon@512.png --out probe-shell.iconset/icon_32x32@2x.png >/dev/null
          sips -z 128 128 assets/icon@512.png --out probe-shell.iconset/icon_128x128.png >/dev/null
          sips -z 256 256 assets/icon@512.png --out probe-shell.iconset/icon_128x128@2x.png >/dev/null
          sips -z 256 256 assets/icon@512.png --out probe-shell.iconset/icon_256x256.png >/dev/null
          sips -z 512 512 assets/icon@512.png --out probe-shell.iconset/icon_256x256@2x.png >/dev/null
          sips -z 512 512 assets/icon@512.png --out probe-shell.iconset/icon_512x512.png >/dev/null
          sips -z 1024 1024 assets/icon@512.png --out probe-shell.iconset/icon_512x512@2x.png >/dev/null
          iconutil -c icns probe-shell.iconset -o "$app/Contents/Resources/probe-shell.icns"

          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Probe Shell</string>
            <key>CFBundleDisplayName</key><string>Probe Shell</string>
            <key>CFBundleIdentifier</key><string>dev.onlychallgener.probe-shell</string>
            <key>CFBundleExecutable</key><string>probe-shell</string>
            <key>CFBundleIconFile</key><string>probe-shell</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF

          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          ditto -c -k --keepParent "$app" "dist/probe-shell-${label}-${{ matrix.name }}.app.zip"

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: needs.check.outputs.publish_release == 'true'
    needs:
      - check
      - build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.label }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
