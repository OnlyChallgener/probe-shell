name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cargo-check:
    name: Cargo check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libfontconfig1-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check Rust project
        run: cargo check --locked

  windows-check-test:
    name: Windows cargo check/test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check Rust project
        run: cargo check --locked

      - name: Test Rust project
        run: cargo test --locked

  finish-wallpaper-settings-repair:
    name: Finish wallpaper settings repair
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/sftp-local-terminal

      - name: Add missing ScrollView closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("ui/interface_panel.slint")
          text = path.read_text(encoding="utf-8")
          marker = '            // --- SFTP page'
          pos = text.find(marker)
          if pos < 0:
              raise SystemExit('SFTP marker not found')

          before = text[:pos]
          after = text[pos:]
          current = '                }\n            }\n\n'
          desired = '                }\n            }\n            }\n\n'
          if before.endswith(desired):
              print('ScrollView closure already present')
          elif before.endswith(current):
              text = before[:-len(current)] + desired + after
              path.write_text(text, encoding='utf-8')
              print('Added missing ScrollView closure')
          else:
              raise SystemExit('Unexpected wallpaper-page ending')
          PY

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- ui/interface_panel.slint; then
            echo "No source change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/interface_panel.slint
          git commit -m "fix: close wallpaper ScrollView correctly"
          git push origin HEAD:fix/sftp-local-terminal
