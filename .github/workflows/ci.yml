name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  cargo-check:
    name: Cargo check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libfontconfig1-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check Rust project
        run: cargo check --locked

  windows-check-test:
    name: Windows cargo check/test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check Rust project
        run: cargo check --locked

      - name: Test Rust project
        run: cargo test --locked

  inspect-v070-release:
    name: Inspect v0.7.0 release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Print release workflow and release status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo '=== RELEASE WORKFLOW RUNS ==='
          gh run list --workflow release.yml --limit 10 \
            --json databaseId,displayTitle,event,headBranch,headSha,status,conclusion,createdAt,updatedAt,url
          echo '=== V0.7.0 RELEASE ==='
          gh release view v0.7.0 \
            --json tagName,name,isDraft,isPrerelease,publishedAt,url,assets \
            || true
