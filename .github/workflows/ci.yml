name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cargo-check:
    name: Cargo check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libfontconfig1-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check Rust project
        run: cargo check --locked

  windows-check-test:
    name: Windows cargo check/test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check Rust project
        run: cargo check --locked

      - name: Test Rust project
        run: cargo test --locked

  commit-v071-source:
    name: Commit v0.7.1 source
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/sftp-local-terminal' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: fix/sftp-local-terminal
          fetch-depth: 0

      - name: Verify requested wallpaper assets
        run: |
          set -euo pipefail
          test -f assets/wallpapers/dark-neon-city.png
          test -f assets/wallpapers/dark-cyber-warrior.png
          test -f assets/wallpapers/light-future-city.png
          test -f assets/wallpapers/light-crystal-guardian.png
          test -f assets/aurora.jpg
          test -f assets/miku.jpg

      - name: Apply prepared source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import subprocess

          workflow = subprocess.check_output(
              ["git", "show", "dfec94d7b476f3daa2fe0ce913432816971c6bbd:.github/workflows/finalize-v071.yml"],
              text=True,
          )
          marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          body = workflow.split(marker, 1)[1].split(end_marker, 1)[0]
          source = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in body.splitlines()
          ) + "\n"

          old_helper = '''def replace_one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)
'''
          new_helper = '''def replace_one(text, old, new, label):
              count = text.count(old)
              if count == 1:
                  return text.replace(old, new, 1)
              parts = re.split(r"(\\s+)", old)
              pattern = "".join(r"\\s+" if part.isspace() else re.escape(part) for part in parts)
              text, flexible_count = re.subn(pattern, lambda _m: new, text, count=1, flags=re.S)
              if flexible_count != 1:
                  raise SystemExit(f"{label}: exact={count}, flexible={flexible_count}")
              return text
'''
          if old_helper not in source:
              raise SystemExit("replace_one helper not found")
          source = source.replace(old_helper, new_helper, 1)
          exec(compile(source, "finalize-v071.py", "exec"), {})
          PY

      - name: Format Rust source
        run: cargo fmt --all || true

      - name: Commit intended source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md src/app.rs src/config.rs src/wallpaper.rs ui/app.slint ui/interface_panel.slint ui/sftp_panel.slint
          git commit -m "release: v0.7.1 wallpaper and interaction fixes"
          git push origin HEAD:fix/sftp-local-terminal
