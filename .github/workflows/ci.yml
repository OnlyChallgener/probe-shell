name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  cargo-check:
    name: Cargo check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libfontconfig1-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check Rust project
        run: cargo check --locked

  windows-check-test:
    name: Windows cargo check/test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check Rust project
        run: cargo check --locked

      - name: Test Rust project
        run: cargo test --locked

  dispatch-v070-release:
    name: Dispatch corrected v0.7.0 release
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - name: Start release workflow and print run ID
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref fix/sftp-local-terminal -f release_tag=v0.7.0
          run_id=""
          for _ in $(seq 1 30); do
            candidate="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --event workflow_dispatch --branch fix/sftp-local-terminal --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [[ "$candidate" != "0" && "$candidate" != "$before" ]]; then
              run_id="$candidate"
              break
            fi
            sleep 2
          done
          test -n "$run_id"
          echo "RELEASE_RUN_ID=$run_id"
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status,conclusion,url,headBranch,headSha
