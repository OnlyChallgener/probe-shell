name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  cargo-check:
    name: Cargo check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libfontconfig1-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check Rust project
        run: cargo check --locked

  windows-check-test:
    name: Windows cargo check/test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check Rust project
        run: cargo check --locked

      - name: Test Rust project
        run: cargo test --locked

  inspect-v070-release:
    name: Inspect v0.7.0 release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sftp-local-terminal
          fetch-depth: 4
      - name: Capture release workflow and release status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list --workflow release.yml --limit 10 \
            --json databaseId,displayTitle,event,headBranch,headSha,status,conclusion,createdAt,updatedAt,url \
            > RELEASE_STATUS.json
          if ! gh release view v0.7.0 \
            --json tagName,name,isDraft,isPrerelease,publishedAt,url,assets \
            > RELEASE_VIEW.json; then
            printf '%s\n' '{"release":"not-found"}' > RELEASE_VIEW.json
          fi
      - name: Save result and restore CI workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show HEAD^^^:.github/workflows/ci.yml > .github/workflows/ci.yml
          git rm -f --ignore-unmatch .github/workflows/inspect-v070-release.yml
          git add .github/workflows/ci.yml RELEASE_STATUS.json RELEASE_VIEW.json
          git commit -m "ci: record v0.7.0 release result"
          git push origin HEAD:fix/sftp-local-terminal
