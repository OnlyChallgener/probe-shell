name: Finalize wallpapers and v0.7.0

"on":
  push:
    branches:
      - fix/sftp-local-terminal
    paths:
      - assets/wallpapers/dark-mecha.jpg
      - assets/wallpapers/dark-city.jpg
      - assets/wallpapers/dark-network.jpg
      - assets/wallpapers/light-crystal.jpg
      - assets/wallpapers/light-network.jpg
      - assets/wallpapers/light-lab.jpg
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: finalize-wallpapers-v070
  cancel-in-progress: true

jobs:
  finalize:
    name: Integrate, verify and release v0.7.0
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/sftp-local-terminal
          fetch-depth: 0

      - name: Validate all six wallpaper files
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          files=(
            assets/wallpapers/dark-mecha.jpg
            assets/wallpapers/dark-city.jpg
            assets/wallpapers/dark-network.jpg
            assets/wallpapers/light-crystal.jpg
            assets/wallpapers/light-network.jpg
            assets/wallpapers/light-lab.jpg
          )
          for file in "${files[@]}"; do
            test -s "$file"
            file "$file" | grep -qiE 'JPEG image data|PNG image data'
          done

      - name: Install Linux build dependencies
        id: deps
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake \
            libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev libudev-dev

      - name: Install Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply wallpaper settings and v0.7.0 version
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '"builtin:dark-mecha" => decode_bundled' src/wallpaper.rs \
            && grep -q 'root.set-wallpaper("builtin:dark-mecha")' ui/interface_panel.slint \
            && grep -q '^version = "0.7.0"' Cargo.toml; then
            echo "Wallpaper integration is already applied; continuing with verification."
          else
            python scripts/prepare_v070.py
          fi

      - name: Verify formatting, compilation and tests
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          cargo check
          cargo test --locked

      - name: Commit verified integration and create tag
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -f --ignore-unmatch assets/wallpapers/probe-wallpapers.zip
          git rm -f --ignore-unmatch ONE_SHOT_FAILURE.md
          git add Cargo.toml Cargo.lock src/config.rs src/wallpaper.rs ui/interface_panel.slint \
            .github/workflows/release.yml assets/wallpapers
          git commit -m "feat: add wallpaper collection and multi-platform release" || true
          git push origin HEAD:fix/sftp-local-terminal

          if git ls-remote --exit-code --tags origin refs/tags/v0.7.0 >/dev/null 2>&1; then
            tagged_commit="$(git ls-remote origin 'refs/tags/v0.7.0^{}' | cut -f1)"
            if [[ -z "$tagged_commit" ]]; then
              tagged_commit="$(git ls-remote origin refs/tags/v0.7.0 | cut -f1)"
            fi
            if [[ "$tagged_commit" != "$(git rev-parse HEAD)" ]]; then
              echo "Tag v0.7.0 exists on a different commit; refusing to move it." >&2
              exit 1
            fi
          else
            git tag -a v0.7.0 -m "Probe Shell v0.7.0"
            git push origin v0.7.0
          fi

      - name: Start the multi-platform release workflow
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref v0.7.0

      - name: Remove temporary finalization files from branch
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-wallpapers-release.yml scripts/prepare_v070.py
          git commit -m "chore: remove v0.7.0 finalization helpers"
          git push origin HEAD:fix/sftp-local-terminal

      - name: Record pre-release failure stage on branch
        if: failure() && steps.publish.outcome != 'success'
        shell: bash
        env:
          ASSETS: ${{ steps.assets.outcome }}
          DEPS: ${{ steps.deps.outcome }}
          RUST: ${{ steps.rust.outcome }}
          PATCH: ${{ steps.patch.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          cat > ONE_SHOT_FAILURE.md <<EOF
          # v0.7.0 finalization failure

          Run: ${GITHUB_RUN_ID}

          - assets: ${ASSETS}
          - dependencies: ${DEPS}
          - rust: ${RUST}
          - patch: ${PATCH}
          - verify: ${VERIFY}
          - publish: ${PUBLISH}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ONE_SHOT_FAILURE.md
          git commit -m "ci: record v0.7.0 finalization failure" || true
          git push origin HEAD:fix/sftp-local-terminal
