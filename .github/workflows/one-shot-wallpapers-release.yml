name: One-shot wallpapers and v0.7.0 release

"on":
  push:
    branches:
      - fix/sftp-local-terminal
    paths:
      - .github/workflows/one-shot-wallpapers-release.yml
      - scripts/prepare_v070.py
      - assets/wallpapers/probe-wallpapers.zip
      - .github/workflows/release.yml

permissions:
  contents: write

concurrency:
  group: one-shot-wallpapers-v070
  cancel-in-progress: true

jobs:
  prepare-test-tag:
    name: Patch, verify and tag v0.7.0
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/sftp-local-terminal
          fetch-depth: 0

      - name: Install Linux build dependencies
        id: deps
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake \
            libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev libudev-dev

      - name: Install Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Expand bundled wallpaper assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import binascii
          import struct
          import zlib

          archive = Path("assets/wallpapers/probe-wallpapers.zip")
          output = archive.parent
          expected = {
              "dark-mecha.jpg",
              "dark-city.jpg",
              "dark-network.jpg",
              "light-crystal.jpg",
              "light-network.jpg",
              "light-lab.jpg",
          }
          data = archive.read_bytes()
          cursor = 0
          extracted = set()
          signature = b"PK\x03\x04"

          # The archive's directory/size metadata is damaged. Recover each
          # intact local deflate stream and accept only the six expected JPEGs.
          while True:
              pos = data.find(signature, cursor)
              if pos < 0:
                  break
              if pos + 30 > len(data):
                  break

              (
                  _version,
                  flags,
                  method,
                  _mtime,
                  _mdate,
                  crc32,
                  compressed_size,
                  uncompressed_size,
                  name_size,
                  extra_size,
              ) = struct.unpack_from("<5H3I2H", data, pos + 4)

              name_start = pos + 30
              name_end = name_start + name_size
              data_start = name_end + extra_size
              if data_start > len(data):
                  cursor = pos + 4
                  continue

              encoding = "utf-8" if flags & 0x0800 else "cp437"
              name = data[name_start:name_end].decode(encoding)
              basename = Path(name).name
              if basename not in expected:
                  cursor = pos + 4
                  continue

              if method == 0:
                  data_end = data_start + compressed_size
                  if data_end > len(data):
                      raise SystemExit(f"Truncated stored entry: {basename}")
                  decoded = data[data_start:data_end]
              elif method == 8:
                  decoder = zlib.decompressobj(-15)
                  decoded = decoder.decompress(data[data_start:])
                  decoded += decoder.flush()
                  if not decoder.eof:
                      raise SystemExit(f"Truncated deflate stream: {basename}")
                  consumed = len(data[data_start:]) - len(decoder.unused_data)
                  data_end = data_start + consumed
              else:
                  raise SystemExit(f"Unsupported ZIP compression method: {method}")

              if uncompressed_size and len(decoded) != uncompressed_size:
                  raise SystemExit(f"Size mismatch for {basename}")
              if binascii.crc32(decoded) & 0xFFFFFFFF != crc32:
                  raise SystemExit(f"CRC mismatch for {basename}")

              (output / basename).write_bytes(decoded)
              extracted.add(basename)
              cursor = max(data_end, pos + 4)

          missing = expected - extracted
          if missing:
              raise SystemExit(f"Missing wallpaper assets: {sorted(missing)}")
          archive.unlink()
          PY

      - name: Patch wallpaper integration and version
        id: patch
        run: python scripts/prepare_v070.py

      - name: Validate formatting and tests
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          cargo check
          cargo test --locked

      - name: Commit verified files and tag
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v0.7.0 >/dev/null 2>&1; then
            echo "Tag v0.7.0 already exists; refusing to move it." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-wallpapers-release.yml scripts/prepare_v070.py
          git rm -f --ignore-unmatch ONE_SHOT_FAILURE.md
          git add Cargo.toml Cargo.lock src/config.rs src/wallpaper.rs ui/interface_panel.slint \
            .github/workflows/release.yml assets/wallpapers
          git commit -m "feat: add wallpaper collection and multi-platform release"
          git push origin HEAD:fix/sftp-local-terminal
          git tag -a v0.7.0 -m "Probe Shell v0.7.0"
          git push origin v0.7.0

      - name: Record failure stage on branch
        if: failure()
        shell: bash
        env:
          DEPS: ${{ steps.deps.outcome }}
          RUST: ${{ steps.rust.outcome }}
          ASSETS: ${{ steps.assets.outcome }}
          PATCH: ${{ steps.patch.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          cat > ONE_SHOT_FAILURE.md <<EOF
          # v0.7.0 one-shot failure

          Run: ${GITHUB_RUN_ID}

          - dependencies: ${DEPS}
          - rust: ${RUST}
          - assets: ${ASSETS}
          - patch: ${PATCH}
          - verify: ${VERIFY}
          - publish: ${PUBLISH}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ONE_SHOT_FAILURE.md
          git commit -m "ci: record v0.7.0 one-shot failure" || true
          git push origin HEAD:fix/sftp-local-terminal
