name: Temporary autofix source

on:
  push:
    branches:
      - fix/sftp-local-terminal
    paths:
      - .github/workflows/temporary-autofix-build.yml

permissions:
  contents: write

jobs:
  patch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/sftp-local-terminal
          fetch-depth: 0

      - name: Repair spawn_edit_watcher return value
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/sftp.rs")
          text = path.read_text(encoding="utf-8")
          marker = "fn spawn_edit_watcher("
          start = text.find(marker)
          if start < 0:
              raise SystemExit("spawn_edit_watcher was not found")
          end_marker = "\n// ---------------------------------------------------------------------------\n// SFTP helpers"
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit("spawn_edit_watcher end marker was not found")
          block = text[start:end]
          old_tail = "    });\n}"
          if old_tail not in block:
              raise SystemExit("expected semicolon tail was not found")
          fixed = block.rsplit(old_tail, 1)[0] + "    })\n}"
          path.write_text(text[:start] + fixed + text[end:], encoding="utf-8")

      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sftp.rs
          git commit -m "fix: return SFTP edit watcher handle"
          git pull --rebase origin fix/sftp-local-terminal
          git push origin HEAD:fix/sftp-local-terminal
