name: v0.7.1 Release Runner

"on":
  pull_request:
    branches:
      - '**'

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    if: github.head_ref == 'fix/sftp-local-terminal'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: fix/sftp-local-terminal
          fetch-depth: 0

      - name: Verify wallpaper assets
        run: |
          set -euo pipefail
          test -f assets/wallpapers/dark-neon-city.png
          test -f assets/wallpapers/dark-cyber-warrior.png
          test -f assets/wallpapers/light-future-city.png
          test -f assets/wallpapers/light-crystal-guardian.png
          test -f assets/aurora.jpg
          test -f assets/miku.jpg

      - name: Apply the prepared source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'BOOT'
          from pathlib import Path
          import re

          # Apply the two whitespace-sensitive drag fixes with regex first.
          sftp_path = Path('ui/sftp_panel.slint')
          sftp = sftp_path.read_text(encoding='utf-8')
          sftp, n1 = re.subn(
              r'root\.qa-popup-dragging = true;\s*root\.qa-popup-drag-start-x = self\.mouse-x;\s*root\.qa-popup-drag-start-y = self\.mouse-y;',
              '''root.qa-popup-dragging = true;
                                                root.qa-popup-drag-start-x = self.absolute-position.x + self.mouse-x;
                                                root.qa-popup-drag-start-y = self.absolute-position.y + self.mouse-y;
                                                root.qa-popup-drag-base-x = root.qa-popup-offset-x;
                                                root.qa-popup-drag-base-y = root.qa-popup-offset-y;''',
              sftp,
              count=1,
          )
          sftp, n2 = re.subn(
              r'if \(root\.qa-popup-dragging\) \{\s*root\.qa-popup-offset-x = root\.qa-popup-offset-x \+ self\.mouse-x - root\.qa-popup-drag-start-x;\s*root\.qa-popup-offset-y = root\.qa-popup-offset-y \+ self\.mouse-y - root\.qa-popup-drag-start-y;\s*\}',
              '''if (root.qa-popup-dragging) {
                                                root.qa-popup-offset-x = clamp(
                                                    root.qa-popup-drag-base-x + self.absolute-position.x + self.mouse-x - root.qa-popup-drag-start-x,
                                                    -(root.width - root.qa-popup-width) / 2 + 8px,
                                                    (root.width - root.qa-popup-width) / 2 - 8px);
                                                root.qa-popup-offset-y = clamp(
                                                    root.qa-popup-drag-base-y + self.absolute-position.y + self.mouse-y - root.qa-popup-drag-start-y,
                                                    -(root.height - root.qa-popup-height) / 2 + 8px,
                                                    (root.height - root.qa-popup-height) / 2 - 8px);
                                            }''',
              sftp,
              count=1,
          )
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'could not prepatch quick-directory drag: start={n1}, move={n2}')
          sftp_path.write_text(sftp, encoding='utf-8')

          workflow = Path('.github/workflows/finalize-v071.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          if marker not in workflow or end_marker not in workflow:
              raise SystemExit('could not locate embedded v0.7.1 patch script')
          body = workflow.split(marker, 1)[1].split(end_marker, 1)[0]
          source = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in body.splitlines()
          ) + '\n'
          old_helper = '''def replace_once(text, old, new, label):
    count = text.count(old)
    if count != 1:
        raise SystemExit(f"{label}: expected exactly one match, found {count}")
    return text.replace(old, new, 1)
'''
          new_helper = '''def replace_once(text, old, new, label):
    count = text.count(old)
    if count == 1:
        return text.replace(old, new, 1)
    if count == 0 and text.count(new) == 1:
        return text
    raise SystemExit(f"{label}: expected old or new text exactly once; old={count}, new={text.count(new)}")
'''
          if old_helper not in source:
              raise SystemExit('could not make the prepared patch idempotent')
          source = source.replace(old_helper, new_helper, 1)
          exec(compile(source, 'finalize-v071.py', 'exec'), {})
          BOOT

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libfontconfig1-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format and validate
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo check --locked
          cargo test --locked

      - name: Restore standard CI and commit v0.7.1
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-v071.yml .github/workflows/v071-run.yml
          cat > .github/workflows/ci.yml <<'EOF'
          name: CI

          on:
            push:
              branches:
                - '**'
            pull_request:
              branches:
                - '**'
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            cargo-check:
              name: Cargo check
              runs-on: ubuntu-latest
              steps:
                - name: Checkout repository
                  uses: actions/checkout@v4

                - name: Install system dependencies
                  run: |
                    sudo apt-get update
                    sudo apt-get install -y pkg-config libudev-dev libfontconfig1-dev

                - name: Install stable Rust
                  uses: dtolnay/rust-toolchain@stable

                - name: Cache Cargo build artifacts
                  uses: Swatinem/rust-cache@v2

                - name: Check Rust project
                  run: cargo check --locked

            windows-check-test:
              name: Windows cargo check/test
              runs-on: windows-latest
              steps:
                - name: Checkout repository
                  uses: actions/checkout@v4

                - name: Install stable Rust
                  uses: dtolnay/rust-toolchain@stable

                - name: Cache Cargo build artifacts
                  uses: Swatinem/rust-cache@v2

                - name: Check Rust project
                  run: cargo check --locked

                - name: Test Rust project
                  run: cargo test --locked
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml Cargo.toml Cargo.lock CHANGELOG.md src/app.rs src/config.rs src/wallpaper.rs ui/app.slint ui/interface_panel.slint ui/sftp_panel.slint
          git add -u .github/workflows/finalize-v071.yml .github/workflows/v071-run.yml
          git commit -m "release: v0.7.1 wallpaper and interaction fixes"
          git push origin HEAD:fix/sftp-local-terminal

      - name: Tag and start multi-platform packaging
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v0.7.1 >/dev/null 2>&1; then
            echo "v0.7.1 already exists" >&2
            exit 1
          fi
          git tag -a v0.7.1 -m "Probe Shell v0.7.1"
          git push origin v0.7.1
          gh workflow run release.yml --ref fix/sftp-local-terminal -f release_tag=v0.7.1
