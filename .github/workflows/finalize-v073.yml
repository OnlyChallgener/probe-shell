name: Finalize v0.7.3 light wallpapers

on:
  push:
    branches:
      - fix/light-wallpaper-v073
    paths:
      - .github/workflows/finalize-v073.yml
      - scripts/fix_light_wallpaper_v073.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-v073-light-wallpapers
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/light-wallpaper-v073
          fetch-depth: 0

      - name: Apply source fix
        run: python3 scripts/fix_light_wallpaper_v073.py

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libfontconfig1-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format and validate
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo check --locked
          cargo test --locked

      - name: Commit v0.7.3 source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md ui/theme.slint
          if git diff --cached --quiet; then
            echo "v0.7.3 source changes already committed"
          else
            git commit -m "fix: show light wallpapers and Miku"
            git push origin HEAD:fix/light-wallpaper-v073
          fi
