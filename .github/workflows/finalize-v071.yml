name: v0.7.1 Source Patch

"on":
  workflow_dispatch:

jobs:
  source-patch:
    runs-on: ubuntu-22.04
    steps:
      - run: |
          python3 - <<'PY'
          import re
          import subprocess

          workflow = subprocess.check_output(
              ["git", "show", "dfec94d7b476f3daa2fe0ce913432816971c6bbd:.github/workflows/finalize-v071.yml"],
              text=True,
          )
          marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          body = workflow.split(marker, 1)[1].split(end_marker, 1)[0]
          source = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in body.splitlines()
          ) + "\n"

          old_helper = '''def replace_one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)
'''
          new_helper = '''def replace_one(text, old, new, label):
              count = text.count(old)
              if count == 1:
                  return text.replace(old, new, 1)
              parts = re.split(r"(\\s+)", old)
              pattern = "".join(r"\\s+" if part.isspace() else re.escape(part) for part in parts)
              text, flexible_count = re.subn(pattern, lambda _m: new, text, count=1, flags=re.S)
              if flexible_count != 1:
                  raise SystemExit(f"{label}: exact={count}, flexible={flexible_count}")
              return text
'''
          if old_helper not in source:
              raise SystemExit("replace_one helper was not found in prepared patch")
          source = source.replace(old_helper, new_helper, 1)
          exec(compile(source, "finalize-v071.py", "exec"), {})
          PY
